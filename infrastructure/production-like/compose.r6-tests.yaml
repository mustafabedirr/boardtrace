name: boardtrace-r6-tests

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: boardtrace_test
      POSTGRES_USER: runtime
      POSTGRES_PASSWORD: test-only-database
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtime -d boardtrace_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [qualification]
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

networks:
  qualification:

volumes:
  postgres-test-data:
