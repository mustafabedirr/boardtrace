name: boardtrace-r5

x-api-environment: &api-environment
  BOARDTRACE_ENVIRONMENT: production
  BOARDTRACE_LOG_FORMAT: json
  BOARDTRACE_CORS_ALLOWED_ORIGINS: '["https://boardtrace.test"]'
  BOARDTRACE_TRUSTED_HOSTS: '["api","caddy"]'
  BOARDTRACE_DATABASE_URL: postgresql+asyncpg://runtime:test-only-database@postgres:5432/boardtrace
  BOARDTRACE_REDIS_URL: redis://redis:6379/0
  BOARDTRACE_RATE_LIMIT_ENABLED: "true"
  BOARDTRACE_JWT_SIGNING_SECRET: test-only-jwt-signing-secret-32-characters
  BOARDTRACE_REFRESH_TOKEN_PEPPER: test-only-refresh-pepper-distinct-32-chars
  BOARDTRACE_STOCKFISH_PATH: /usr/games/stockfish
  BOARDTRACE_ANALYSIS_AUTOMATIC_RETRY_ENABLED: "false"
  BOARDTRACE_ANALYSIS_TASK_SOFT_TIME_LIMIT_SECONDS: "170"
  BOARDTRACE_ANALYSIS_TASK_TIME_LIMIT_SECONDS: "180"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: boardtrace
      POSTGRES_USER: runtime
      POSTGRES_PASSWORD: test-only-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtime -d boardtrace"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [boardtrace]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [boardtrace]

  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/production-like/Dockerfile.api
    environment: *api-environment
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [boardtrace]

  api:
    build:
      context: ../..
      dockerfile: infrastructure/production-like/Dockerfile.api
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health', headers={'Host':'api'}); assert urllib.request.urlopen(r, timeout=3).status == 200",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [boardtrace]

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/production-like/Dockerfile.api
    environment: *api-environment
    command:
      [
        "celery",
        "-A",
        "boardtrace_api.worker.celery_app",
        "worker",
        "--beat",
        "--schedule=/tmp/boardtrace-celerybeat-schedule",
        "--loglevel=INFO",
        "--concurrency=2",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A boardtrace_api.worker.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 5s
      timeout: 8s
      retries: 30
    networks: [boardtrace]

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [boardtrace, edge]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: [operations]
    ports:
      - "127.0.0.1:13001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks: [boardtrace]

  dozzle:
    image: amir20/dozzle:v8.14.4
    profiles: [operations]
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [boardtrace]

  restore-postgres:
    image: postgres:16-alpine
    profiles: [disaster-recovery]
    environment:
      POSTGRES_DB: boardtrace_restore
      POSTGRES_USER: restore
      POSTGRES_PASSWORD: test-only-restore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restore -d boardtrace_restore"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - restore-postgres-data:/var/lib/postgresql/data
    networks: [boardtrace]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [disaster-recovery]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: test-only-minio-user
      MINIO_ROOT_PASSWORD: test-only-minio-password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - minio-data:/data
    networks: [boardtrace]

  backup:
    build:
      context: ../..
      dockerfile: infrastructure/production-like/Dockerfile.backup
    profiles: [disaster-recovery]
    environment:
      SOURCE_DATABASE_URL: postgresql://runtime:test-only-database@postgres:5432/boardtrace
      RESTORE_DATABASE_URL: postgresql://restore:test-only-restore@restore-postgres:5432/boardtrace_restore
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: boardtrace-r5-backups
      AWS_ACCESS_KEY_ID: test-only-minio-user
      AWS_SECRET_ACCESS_KEY: test-only-minio-password
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      restore-postgres:
        condition: service_healthy
    volumes:
      - backup-work:/work
    networks: [boardtrace]

networks:
  boardtrace:
    internal: true
  edge:

volumes:
  postgres-data:
  uptime-kuma-data:
  restore-postgres-data:
  minio-data:
  backup-work:
