# BoardTrace closed-pilot SSH target. Installed only after an operator confirms
# that the named administration accounts have working authorized_keys entries.
Port 48227
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
# Local forwarding is required only for SSH-tunnel access to Dozzle/Uptime Kuma.
AllowTcpForwarding local
PermitTunnel no
